# TrouvePro CI — Node.js >= 22, built-in test runner (node --test)
stages:
  - test

test:
  stage: test
  image: node:22
  script:
    - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
