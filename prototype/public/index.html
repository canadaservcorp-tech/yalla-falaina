<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yalla Falaina — Concierge Prototype</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16212c;
    --accent: #2fae6b;
    --accent-dim: #1f7a4a;
    --text: #eef3f7;
    --text-dim: #9fb1bf;
    --bubble-user: #22384a;
    --bubble-bot: #1c2b36;
    --border: #24343f;
    --warn: #d9a441;
    --danger: #d9614a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, input[type="text"] {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  #chatPane {
    flex: 2;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-width: 0;
  }
  #jobsPane {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
    background: var(--panel);
    min-width: 260px;
  }
  #jobsPane h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin: 0 0 10px 0;
  }
  .job-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .job-card .title { font-weight: 600; margin-bottom: 2px; }
  .job-card .meta { color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }
  .job-card .flag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 6px;
    margin-right: 4px;
  }
  .flag.unverified { background: rgba(217, 164, 65, 0.18); color: var(--warn); }
  .flag.honesty { background: rgba(217, 97, 74, 0.15); color: var(--danger); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
  }
  #inputRow {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  #inputRow input {
    flex: 1;
    font-size: 14px;
    padding: 10px 12px;
  }
  #inputRow button {
    background: var(--accent);
    color: #08150e;
    border: none;
    border-radius: 6px;
    padding: 0 18px;
    font-weight: 600;
    cursor: pointer;
  }
  #inputRow button:hover { background: var(--accent-dim); }
  #inputRow button:disabled { opacity: 0.5; cursor: default; }
  [dir="rtl"] .msg.user { align-self: flex-start; border-bottom-left-radius: 4px; border-bottom-right-radius: 12px; }
  [dir="rtl"] .msg.bot { align-self: flex-end; border-bottom-right-radius: 4px; border-bottom-left-radius: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Yalla Falaina — Concierge Prototype</h1>
    <div class="subtitle">"Your Assistant to Travel" · demo only, mock job data, no payments</div>
  </div>
  <div class="controls">
    <select id="dialectSelect">
      <option value="">Auto-detect language/dialect</option>
      <option value="Lebanese Arabic">Lebanese Arabic</option>
      <option value="Syrian Arabic">Syrian Arabic</option>
      <option value="Egyptian Arabic">Egyptian Arabic</option>
      <option value="French">Français</option>
      <option value="English">English</option>
    </select>
    <input type="text" id="countryInput" placeholder="Preferred country (optional)">
  </div>
</header>
<main>
  <div id="chatPane">
    <div id="messages"></div>
    <div id="inputRow">
      <input type="text" id="messageInput" placeholder="Type your message… (kifak? / bonjour / hello)" autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>
  <div id="jobsPane">
    <h2>Retrieved from mock feed</h2>
    <div id="jobsList"><p style="color:var(--text-dim);font-size:13px;">Send a message to see what the matching engine finds — jobs shown here are only ones the AI is allowed to reference.</p></div>
  </div>
</main>

<script>
  const messagesEl = document.getElementById('messages');
  const jobsListEl = document.getElementById('jobsList');
  const inputEl = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const dialectSelect = document.getElementById('dialectSelect');
  const countryInput = document.getElementById('countryInput');

  let history = [];

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderJobs(jobs) {
    if (!jobs || jobs.length === 0) {
      jobsListEl.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">No jobs matched this message in the mock feed.</p>';
      return;
    }
    jobsListEl.innerHTML = '';
    jobs.forEach((j) => {
      const card = document.createElement('div');
      card.className = 'job-card';
      const flags = [];
      if (j.sourceType === 'informal_unverified') {
        flags.push('<span class="flag unverified">unverified listing</span>');
      }
      (j.honestyFlags || []).forEach((f) => {
        flags.push('<span class="flag honesty">' + f.replace(/_/g, ' ') + '</span>');
      });
      card.innerHTML =
        '<div class="title">' + j.title + '</div>' +
        '<div class="meta">' + j.city + ', ' + j.country + ' · ' + j.category + '</div>' +
        '<div class="meta">' + j.salaryNote + '</div>' +
        flags.join('');
      jobsListEl.appendChild(card);
    });
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    sendBtn.disabled = true;
    addMessage('user', text);
    history.push({ role: 'user', content: text });

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          history: history.slice(0, -1),
          dialectHint: dialectSelect.value || undefined,
          preferredCountry: countryInput.value || undefined
        })
      });
      const data = await res.json();
      if (!res.ok) {
        addMessage('system', 'Error: ' + (data.error || res.statusText));
        return;
      }
      addMessage('bot', data.reply);
      history.push({ role: 'assistant', content: data.reply });
      renderJobs(data.jobs);
      if (data.llmConfigured === false) {
        addMessage('system', 'Running in demo mode — no ANTHROPIC_API_KEY set on the server.');
      }
    } catch (err) {
      addMessage('system', 'Network error — is the server running?');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
  dialectSelect.addEventListener('change', () => {
    const val = dialectSelect.value;
    document.documentElement.setAttribute('dir', val === '' ? 'ltr' : (val.includes('Arabic') ? 'rtl' : 'ltr'));
  });

  addMessage('system', 'Prototype demo — mock job data, no real payments or accounts. Try: "I want to travel but I have no money", "cherche un poste d\'électricien au Canada", or "3andi khibra b shawarma".');
</script>
</body>
</html>
